name: Update profile art

# Refreshes the contribution graph + stats card SVGs from real data.
# Runs daily, whenever the scripts change on main, and on demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update-profile-art.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render contribution graph
        run: python scripts/render_heatmap_svg.py

      - name: Render stats card
        run: python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json assets/contrib-heatmap.svg assets/stats.svg"
